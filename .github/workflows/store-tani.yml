name: Store teşhisi (geçici)

# GEÇİCİ. Uygulama içi satın alma yazılmadan önce Windows'ta ölçüm yapar:
# windows.services.store'u hangi PyPI paketi sağlıyor, HWND bağlama sembolü ne,
# thread STA mı MTA mı. Sekme çubuğu vakasının dersi: ikinci başarısızlıkta
# tahmin bırakılır, ölçüm konur. Cevap alınınca bu dosya SİLİNİR.
#
# MSIX iş akışından ayrı: orası PyInstaller yüzünden ~6 dakika, bu 1 dakika.

on:
  workflow_dispatch:

jobs:
  tani:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aday paketleri kur
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6
          pip install winsdk

      - name: winrt projeksiyonlarını da dene
        continue-on-error: true
        run: pip install winrt-Windows.Services.Store winrt-runtime

      - name: Ölç
        run: python store_tani.py
