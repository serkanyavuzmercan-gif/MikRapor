name: MSIX paketi

# Neden ayrı workflow: ci.yml ubuntu'da lint+test koşuyor, bu Windows gerektiriyor
# (MakeAppx/SignTool yalnız Windows SDK'da var) ve her push'ta koşturmak pahalı.
#
# ÖNCE ELLE KOŞTURULUR (workflow_dispatch), çıktı doğrulanır, SONRA etiket kesilir.
# Etiketi bozuk bir artefakta bağlamak geri alınamaz bir iştir.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Çıktıları GitHub Release'e yükle (etiket gerekir)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.3.0" pillow

      # Testler burada da koşar: mağazaya gidecek paketi doğrulanmamış koddan
      # üretmek, 594 testin varlık sebebini boşa çıkarır.
      # GEÇİCİ TEŞHİS: sekme çubuğu Windows'ta neden taşıyor? Altı körlemesine
      # denemeden sonra tahmin etmeyi bırakıp runner'a soruyoruz.
      - name: Sekme çubuğu teşhisi
        continue-on-error: true
        run: python sekme_tani.py

      - name: Testler
        run: python -m unittest discover -s . -p "test_*.py" -q

      - name: Asset üret (logo, ikon, MSIX kutucukları, chevron)
        run: python assets/generate_icons.py

      - name: Sürümü oku
        id: surum
        shell: pwsh
        run: |
          $s = (Select-String -Path infra/surum.py -Pattern '^SURUM = "(.+)"').Matches[0].Groups[1].Value
          # MSIX dört parçalı ister; son parçayı Store kendine ayırdığı için 0 kalır.
          "surum=$s"        >> $env:GITHUB_OUTPUT
          "msix=$s.0"       >> $env:GITHUB_OUTPUT
          Write-Host "Sürüm: $s -> MSIX $s.0"

      # ---------------------------------------------------------------- onefile
      # Doğrudan indirilen tek dosya. MSIX'e GİRMEZ.
      - name: Derle (onefile — doğrudan indirme)
        run: pyinstaller --clean --noconfirm MikRapor.spec

      - name: Tek dosya exe'yi ayır
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item dist/MikRapor.exe out/MikRapor-${{ steps.surum.outputs.surum }}.exe
          Remove-Item -Recurse -Force dist, build

      # ----------------------------------------------------------------- onedir
      # MSIX'in içine giren biçim. onefile koymak her açılışta paketi geçici klasöre
      # açtırır: yavaş açılış + sertifikasyon riski.
      - name: Derle (onedir — MSIX gövdesi)
        env:
          MIKRAPOR_ONEDIR: "1"
        run: pyinstaller --clean --noconfirm MikRapor.spec

      - name: Paket klasörünü kur
        shell: pwsh
        run: |
          $pkg = "msix-root"
          Copy-Item -Recurse dist/MikRapor $pkg
          Copy-Item packaging/AppxManifest.xml "$pkg/AppxManifest.xml"
          New-Item -ItemType Directory -Force -Path "$pkg/assets" | Out-Null
          Copy-Item assets/store/*.png "$pkg/assets/"
          # Sürüm manifest'e BURADA yazılır — repodaki 0.0.0.0 bilerek geçersizdir,
          # tek sürüm kaynağı infra/surum.py.
          $m = "$pkg/AppxManifest.xml"
          (Get-Content $m -Raw) -replace 'Version="0\.0\.0\.0"', 'Version="${{ steps.surum.outputs.msix }}"' |
            Set-Content $m -Encoding UTF8
          if (-not (Select-String -Path $m -Pattern 'Version="${{ steps.surum.outputs.msix }}"' -Quiet)) {
            throw "Manifest sürümü yazılamadı — yer tutucu değişmedi."
          }
          if (-not (Test-Path "$pkg/MikRapor.exe")) { throw "$pkg/MikRapor.exe yok." }

      - name: Windows SDK araçlarını bul
        id: sdk
        shell: pwsh
        run: |
          $bin = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Directory |
                 Where-Object { Test-Path "$($_.FullName)/x64/makeappx.exe" } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bin) { throw "makeappx.exe bulunamadı." }
          "path=$($bin.FullName)/x64" >> $env:GITHUB_OUTPUT
          Write-Host "SDK: $($bin.FullName)/x64"

      # ------------------------------------------------------- STORE ARTEFAKTI
      # İMZASIZ. Store paketi Microsoft tarafından imzalanır; kendi sertifikanızla
      # imzalamak gerekmez ve Partner Center'a imzasız yüklenir.
      - name: MSIX paketle (Store için — imzasız)
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.path }}/makeappx.exe" pack `
              /d msix-root /p "out/MikRapor-${{ steps.surum.outputs.surum }}-store.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx başarısız ($LASTEXITCODE)" }

      # --------------------------------------------------- SERTİFİKASYON KONTROLÜ
      # Store zaten bunu koşturuyor; önden koşmazsak geri bildirim günler sonra
      # Partner Center üzerinden gelir.
      - name: Windows App Certification Kit
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "C:/Program Files (x86)/Windows Kits/10/App Certification Kit/appcert.exe"
          if (-not (Test-Path $appcert)) {
            Write-Warning "appcert.exe runner'da yok — WACK atlandı."
            exit 0
          }
          & $appcert reset
          & $appcert test -appxpackagepath "out/MikRapor-${{ steps.surum.outputs.surum }}-store.msix" `
                          -reportoutputpath "out/wack-raporu.xml"
          Write-Host "WACK çıkış kodu: $LASTEXITCODE"

      - name: WACK sonucunu özetle
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "out/wack-raporu.xml")) { Write-Host "WACK raporu yok."; exit 0 }
          $x = [xml](Get-Content "out/wack-raporu.xml")
          $x.SelectNodes("//*[@RESULT='FAIL']") | ForEach-Object {
            Write-Host "::warning::WACK FAIL — $($_.NAME)"
          }

      # ---------------------------------------------------- YAN YÜKLEME ARTEFAKTI
      # AYRI DOSYA, AYRI AMAÇ. Store paketiyle karıştırılmaz: bu imzalıdır ve
      # kurulabilmesi için sertifikanın hedef makinede Trusted Root'a eklenmesi
      # gerekir. Store'dan kurulumda böyle bir şart YOKTUR.
      - name: Yan yükleme paketi (kendinden imzalı) + sertifika
        shell: pwsh
        run: |
          $konu = "CN=119D3611-306D-4F5E-B28C-3904B4C07374"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $konu `
                    -KeyUsage DigitalSignature -FriendlyName "MikRapor yan yükleme" `
                    -CertStoreLocation "Cert:\CurrentUser\My" `
                    -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          $pfx = "$env:RUNNER_TEMP/mikrapor.pfx"
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $pw | Out-Null
          # Sertifikanın KENDİSİ (özel anahtar YOK) paylaşılır — kullanıcı bunu
          # Trusted Root'a ekleyip yan yükleme yapabilsin.
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
                             -FilePath "out/MikRapor-yan-yukleme.cer" | Out-Null
          $yan = "out/MikRapor-${{ steps.surum.outputs.surum }}-yanyukleme.msix"
          Copy-Item "out/MikRapor-${{ steps.surum.outputs.surum }}-store.msix" $yan
          & "${{ steps.sdk.outputs.path }}/signtool.exe" sign /fd SHA256 `
              /f $pfx /p ([Runtime.InteropServices.Marshal]::PtrToStringAuto(
                 [Runtime.InteropServices.Marshal]::SecureStringToBSTR($pw))) $yan
          if ($LASTEXITCODE -ne 0) { throw "signtool başarısız ($LASTEXITCODE)" }
          Remove-Item $pfx -Force

      - name: Artefaktları yükle
        uses: actions/upload-artifact@v4
        with:
          name: MikRapor-${{ steps.surum.outputs.surum }}
          path: out/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## MikRapor ${{ steps.surum.outputs.surum }}

            | dosya | ne için |
            |---|---|
            | `MikRapor-…-store.msix` | **Microsoft Store'a yükleme.** İmzasızdır — Store kendisi imzalar. |
            | `MikRapor-…-yanyukleme.msix` | Store dışı kurulum. Önce `MikRapor-yan-yukleme.cer` dosyasını «Güvenilen Kök Sertifika Yetkilileri»ne ekleyin, yoksa Windows kurulumu engeller. |
            | `MikRapor-yan-yukleme.cer` | Yukarıdaki paketin sertifikası (özel anahtar içermez). |
            | `MikRapor-….exe` | Kurulum gerektirmeyen tek dosya. |
